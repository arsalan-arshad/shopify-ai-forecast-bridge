<template>
  <lightning-card title="Shopify Forecast AI Assistant" icon-name="standard:bot">
    <!-- Header Action: Status Badge & Clear -->
    <div slot="actions">
      <div class="slds-grid slds-grid_vertical-align-center">
        <span class="grounded-pill slds-m-right_x-small">
          <span class="pulse-dot"></span> Deterministic Grounding Active
        </span>
        <lightning-button-icon
          icon-name="utility:delete"
          alternative-text="Clear Chat History"
          title="Clear Chat History"
          onclick={handleClearChat}
        >
        </lightning-button-icon>
      </div>
    </div>

    <div class="chat-container">
      <!-- Suggested Prompt Chips -->
      <div class="suggested-chips slds-p-horizontal_small slds-p-top_small slds-scrollable_x">
        <span class="slds-text-title slds-m-right_x-small slds-align-middle">Quick Prompts:</span>
        <template for:each={suggestedPrompts} for:item="prompt">
          <button
            key={prompt}
            class="chip-button"
            data-prompt={prompt}
            onclick={handleSelectChip}
          >
            {prompt}
          </button>
        </template>
      </div>

      <!-- Messages Thread -->
      <div class="messages-viewport slds-p-around_small" role="log" aria-live="polite">
        <template for:each={messages} for:item="msg">
          <div key={msg.id} class={msg.containerClass}>
            <div class={msg.bubbleClass}>
              <div class="msg-header slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                <span class="sender-name">{msg.senderLabel}</span>
                <span class="msg-time">{msg.timeStr}</span>
              </div>
              <div class="msg-content slds-rich-text-editor__output">
                <lightning-formatted-rich-text value={msg.formattedContent}></lightning-formatted-rich-text>
              </div>
            </div>
          </div>
        </template>

        <!-- Loading indicator -->
        <template if:true={isThinking}>
          <div class="message-row assistant-row">
            <div class="message-bubble assistant-bubble typing-bubble">
              <span class="typing-dot"></span>
              <span class="typing-dot"></span>
              <span class="typing-dot"></span>
            </div>
          </div>
        </template>
      </div>

      <!-- Chat Input Toolbar -->
      <div class="chat-input-toolbar slds-p-around_small slds-border_top">
        <div class="slds-grid slds-grid_vertical-align-center">
          <div class="slds-col slds-grow slds-m-right_small">
            <lightning-input
              type="text"
              variant="label-hidden"
              placeholder="Ask an inventory question (e.g., 'Which products will run out first?')..."
              value={userInput}
              onchange={handleInputChange}
              onkeyup={handleKeyUp}
              disabled={isThinking}
            >
            </lightning-input>
          </div>
          <div class="slds-col slds-no-flex">
            <lightning-button
              variant="brand"
              label="Ask AI"
              icon-name="utility:send"
              onclick={handleSendMessage}
              disabled={isSendDisabled}
            >
            </lightning-button>
          </div>
        </div>
      </div>
    </div>
  </lightning-card>
</template>
